S.forEach((s,i)=>{s.t1=i+1<S.length?S[i+1].t0:window.DUREE;});

/* ---------- construction du DOM ---------- */
const bgs=$('#bgs'),sc=$('#scenes');
const veins=`<svg class="veins" width="1080" height="1920" viewBox="0 0 1080 1920"><g fill="none" stroke="#F0E8D6" stroke-opacity=".10" stroke-width="2">${Array.from({length:9},(_,i)=>`<path d="M${-50+i*140} 0 C${100+i*90} 500 ${-100+i*130} 1000 ${200+i*100} 1920"/>`).join('')}</g></svg>`;
[0,1,2].forEach(k=>{const d=document.createElement('div');d.className='bg bg'+k;d.id='bg'+k;d.innerHTML=(k==2?'<div class="rays" id="rays"></div>':'')+(k==0?veins:'')+'<div class="grain"></div>';bgs.appendChild(d)});
S.forEach(s=>{const d=document.createElement('div');d.className='scene';d.innerHTML='<div class="in">'+s.html+'</div>';sc.appendChild(d);s.el=d;s.anim=[...d.querySelectorAll('.a')];s.cnt=[...d.querySelectorAll('.cnt')];});
for(let i=0;i<40;i++){const p=document.createElement('div');p.className='ptc';$('#ptc').appendChild(p)}
const SYMS=['$','%','Δ','36.9°N','56.3°E','$','Δ','%'];
SYMS.forEach(t=>{const e=document.createElement('div');e.className='sym';e.textContent=t;$('#syms').appendChild(e)});
const ptcs=[...document.querySelectorAll('.ptc')],syms=[...document.querySelectorAll('.sym')];

/* ---------- état exact à l'instant t ---------- */
const fmt=n=>n;
function layer(s,t,top){
  const el=s.el, lt=t-s.t0, dur=s.t1-s.t0;
  el.style.display='block'; el.style.zIndex=top?2:1;
  const push=1+0.07*clamp(lt/dur);
  let tr=`scale(${push})`, op=1, fil='';
  const W=0.2;
  if(top && lt<W && !s.noin){
    const e=ease(lt/W), k=S.indexOf(s)%3;
    if(k==0){tr=`translateX(${(1-e)*1080}px) ${tr}`;fil=`blur(${(1-e)*18}px)`}
    else if(k==1){tr=`scale(${1+(1-e)*1.2}) ${tr}`;op=e;fil=`blur(${(1-e)*10}px)`}
    else{const j=(1-e)*30;tr=`translateX(${Math.sin(lt*900)*j}px) ${tr}`;fil=`drop-shadow(${j}px 0 0 #f00) drop-shadow(${-j}px 0 0 #0ff)`}
  }
  if(s.loop){op=1}
  if(s.shake && lt<0.35){const a=(1-lt/.35)*14;tr=`translate(${Math.sin(lt*170)*a}px,${Math.cos(lt*190)*a}px) ${tr}`}
  el.style.transform=tr; el.style.opacity=op; el.style.filter=fil;
  s.anim.forEach(a=>{
    const d=+(a.dataset.d||0);
    let x=(lt-d)/0.28;
    if(s.noin) x=1;
    const e=ease(x);
    let sx=a.dataset.mv?'':'';
    if(a.classList.contains('mv')){
      const p=clamp((lt-d)/(+a.dataset.dur||1)), q=p*p*(3-2*p);
      const dx=(+a.dataset.fx)+((+a.dataset.tx)-(+a.dataset.fx))*q, dy=(+a.dataset.fy)+((+a.dataset.ty)-(+a.dataset.fy))*q;
      const base=a.style.transform.match(/scale\([^)]*\)/);
      a.style.transform=`translate(${dx}px,${dy}px) ${base?base[0]:''}`;
      a.style.opacity=1;
    }else{
      const rot=(a.style.transform.match(/rotate\([^)]*\)/)||[''])[0];
      a.style.opacity=clamp(x*1.4);
      a.style.transform=`${rot} scale(${1.35-0.35*e})`;
      a.style.filter=`blur(${(1-e)*14}px)`;
    }
  });
  s.cnt.forEach(c=>{const d=+(c.dataset.d||0),du=+c.dataset.dur;c.textContent=Math.round((+c.dataset.to)*ease((lt-d)/du))});
  // drapeaux qui flottent
  el.querySelectorAll('.wave').forEach(w=>{w.setAttribute('transform',`skewY(${Math.sin(t*5)*2.5})`)});
}
window.seek=function(t){
  t=clamp(t,0,window.DUREE);
  let i=S.findIndex(s=>t>=s.t0&&t<s.t1); if(i<0)i=S.length-1;
  const s=S[i];
  S.forEach(x=>x.el.style.display='none');
  const lt=t-s.t0;
  if(i>0&&lt<0.2&&!s.noin)layer(S[i-1],t,false);
  layer(s,t,true);
  [0,1,2].forEach(k=>$('#bg'+k).style.display=(k==s.bg?'block':'none'));
  $('#rays').style.transform=`rotate(${t*4}deg)`;
  // zoom sur les kicks
  let kk=0;for(const k of KICKS){if(k<=t)kk=k;else break}
  const kd=t-kk, z=1+0.035*Math.exp(-kd*9);
  $('#stage').style.transform=`scale(${z})`;
  // flash blanc (chiffres / coupes clés)
  $('#flash').style.opacity=s.flash?Math.max(0,0.85*(1-lt/0.16)):0;
  // flash-back : VHS
  const fb=!!s.fb||(t>=FL0&&t<FL1);
  const vi=fb?1:0;
  $('#vhs').style.opacity=vi;
  $('#vhsl').style.opacity=fb?(Math.floor(t*3)%2?0.95:0.35):0;
  $('#vhsl').textContent='◄◄ REWIND';
  $('#stage').style.filter=fb?'sepia(.55) saturate(1.3) contrast(1.08)':'none';
  if(fb){$('#scenes').style.textShadow='';$('#scenes').style.transform=`translateX(${Math.sin(t*40)*3}px)`}else $('#scenes').style.transform='';
  // HUD
  $('#rec').style.opacity=Math.floor(t*2)%2?0.4:1;
  $('#tc').textContent='00:'+String(Math.floor(t)).padStart(2,'0');
  ptcs.forEach((p,n)=>{const sp=18+(n*7)%30,x=(n*263)%1080,y=(1920-((t*sp*4+n*97)%1920));const sz=3+(n%4);p.style.cssText=`left:${x+Math.sin(t+n)*20}px;top:${y}px;width:${sz}px;height:${sz}px;opacity:${0.25+0.35*Math.abs(Math.sin(t*2+n))}`});
  syms.forEach((e,n)=>{e.style.left=(100+(n*131)%800)+'px';e.style.top=(1500-((t*40+n*170)%1000)+0)+'px';e.style.opacity=0.2+0.2*Math.abs(Math.sin(t+n))});
  // sous-titres mot à mot
  let w=null;for(let j=0;j<WORDS.length;j++){const nx=WORDS[j+1]?WORDS[j+1][0]:WORDS[j][1];if(t>=WORDS[j][0]&&t<Math.max(nx,WORDS[j][0]+0.05)){w=WORDS[j];break}}
  const sub=$('#sub');
  if(w){
    const txt=w[2].replace(/[.,;:!?]$/,'');
    const key=/\d|ormuz|iran|mines|guerre|pétroliers|accord|morts/i.test(txt);
    const red=/mines|guerre|morts|frappes|aucun/i.test(txt);
    const fs=Math.min(100,Math.floor(860/(txt.length*0.62)));
    sub.style.fontSize=fs+'px';
    sub.style.color=red?'#D62C30':key?'#E5B547':'#fff';
    const pop=1+0.18*Math.exp(-(t-w[0])*14);
    sub.innerHTML=(key||red?'<u>'+txt+'</u>':txt);
    sub.style.transform=`scale(${pop})`;
  }else sub.innerHTML='';
  sub.style.top='1250px';
};
window.seek(0);
